<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <title>Document</title>
</head>
<body>
    <form action="" id="form-login">
        <main class="container">
            <div class="telaesquerda">
                <h1>Ainda não fez seu <br> registro?</h1>
                <p>Junte-se á brincadeira, registre-se <br>agora e mostre que sua memoria é <br> imbativel</p>
                <input id="button"type="button" value="Criar Agora!" placeholder="Criar Agora!">
                <img src="../assets/images/login_image.png" alt="imagem nao carregada">
            </div>
            <div class="teladireita">
                <h1>Login</h1>
                <p>Faça seu login agora e venha já <br>
                arrasar no ranking!
                </p>

                <input id="input"  type="email" placeholder="Usuário">
                <input id="input" type="password" placeholder="Senha">
                <input id="Login"type="button" value="Entrar">
            </div>
       

        </main>
    </form>  
   
    <script src="../js/auth.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
