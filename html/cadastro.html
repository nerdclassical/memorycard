
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/cadastro.css">
    <title>Document</title>
</head>
<body>
    <form action="registro" id="form-cadastro">
        <main class="container">
        <div class="telaesquerda">
            <h1>Registro</h1>
            <p>Registre-se agora para salvar seu <br>
            progresso e entrar no ranking dos melhores</p>
            <input class="input" type="email" placeholder="Nome">
            <input class="input" type="password" placeholder="senha">
            <input class="button" type="button" value="Cadastrar">
        </div>
        <div class="teladireita">
            <h1>Já tem uma conta?</h1>
            <p>Faça login e continue sua jornada <br>pra se tornar o mestre da memoria!</p>
            <input   class="button"  type="button" value="Entrar agora">

            <div class="image-content">
                <img class="imagem-fundo" src="../assets/images/fundo_register.png" alt="imagem de fundo">
                <img class="imagem-topo" src="../assets/images/register_image.png" alt="imagem da mulher com computador">
            </div>
        </div>
    </main>
    </form>
    <script src="../js/auth.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
