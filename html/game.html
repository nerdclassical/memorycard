<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory Card</title>
  <link rel="stylesheet" href="../css/game.css" />
</head>
<body>
  <div class="navbar">
    <div class="logo">
      <div class="logoImage"></div>
    </div>
    <div class="buttons">
      <div class="buttonsNav">
        <input type="button" onclick="window.location.href='menu.html';" class="navButton" value="Início" />
        <input type="button" onclick="window.location.href='configuration.html';" class="navButton" value="Criar Jogo" />
        <input type="button" onclick="window.location.href='ranking.html';" class="navButton" value="Ranking" />
      </div>
      <div class="select-wrapper">
        <select id="userActions">
          <option value="user">Nome do usuário</option>
          <option class="logout" value="logout">Sair</option>
        </select>
      </div>
    </div>
  </div>

  <section>
    <div class="infomationsPart">
      <div class="attemps">Tentativas: <span id="attempts">0</span></div>
      <div class="time">Tempo: <span id="timer">00:00</span></div>
      <div class="theme">
        <button id="lightTheme" class="btnTheme selected">
          <img id="sunIcon" src="../assets/images/sunSelected.png" alt="Tema Claro" />
        </button>
        <button id="darkTheme" class="btnTheme">
          <img id="moonIcon" src="../assets/images/moonSelected.png" alt="Tema Escuro" />
        </button>
      </div>
    </div>

     

  
    <div class="cardsPart" id="cardsPart"></div>
    <div class="correctPart">Pares corretos: <span id="correctPairs">0</span>/<span id="totalPairs">0</span></div>

    <div id="board"></div>

    
  </section>

  <div class="modal" id="winModal">
    <div class="modal-content">
      <h2>PARABÉNS!</h2>
      <p>Você encontrou todos os pares com sucesso!!</p>
      <div class="stats">
        <div class="attempsStats">Tentativas: <span id="finalAttempts">0</span></div>
        <div class="timeStats">Tempo: <span id="finalTime">00:00</span></div>
      </div>
      <div class="buttonsModal">
        <button class="modal-btn" onclick="location.reload()">Jogar de novo</button>
        <button class="modal-btn" onclick="window.location.href='ranking.html'">Ver ranking</button>
        <button class="modal-btn" onclick="window.location.href='menu.html'">Voltar ao menu</button>
      </div>
    </div>
  </div>

  <div class="modal" id="loseModal">
    <div class="modal-content">
      <h2>Tempo Esgotado!</h2>
      <p>Infelizmente, o tempo acabou. Tente novamente.</p>
      <div class="buttonsModal">
        <button class="modal-btn" onclick="location.reload()">Tentar de novo</button>
        <button class="modal-btn" onclick="window.location.href='menu.html'">Voltar ao menu</button>
      </div>
    </div>
  </div>


  <script src="../js/game.js"></script>
</body>
</html>
